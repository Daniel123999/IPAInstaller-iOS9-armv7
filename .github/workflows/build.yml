name: Build IPAInstaller (iOS 9 armv7)

# 仅手动触发：macOS 运行器排队严重，避免每次 push 都占用队列。
on:
  workflow_dispatch:

jobs:
  build:
    # macos-13 已进入退役流程，队列极长；改用官方仍支持的 Intel 运行器 macos-15-intel。
    runs-on: macos-15-intel
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          brew update --quiet || true
          brew install ldid dpkg xz make perl || brew install ldid dpkg xz make
          echo "runner: $(uname -a)"
          xcodebuild -version || true
          which dpkg-deb || true

      - name: Install Theos
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks" "$THEOS/bin"
          # Theos packaging may require dm.pl
          if [ ! -x "$THEOS/bin/dm.pl" ]; then
            DMPL=$(find "$THEOS" -name 'dm.pl' -not -path '*/test/*' | head -n 1 || true)
            if [ -n "$DMPL" ]; then
              cp "$DMPL" "$THEOS/bin/dm.pl"
              chmod +x "$THEOS/bin/dm.pl"
            else
              curl -fsSL "https://raw.githubusercontent.com/theos/theos/master/bin/dm.pl" -o "$THEOS/bin/dm.pl" || true
              chmod +x "$THEOS/bin/dm.pl" || true
            fi
          fi
          # Fetch SDKs (branch/structure may vary)
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/theos-sdks || true
          if [ -d /tmp/theos-sdks ]; then
            find /tmp/theos-sdks -name '*.sdk' -not -path '*__MACOSX*' -exec cp -R {} "$THEOS/sdks/" \; 2>/dev/null || true
          fi
          if [ -z "$(ls -A "$THEOS/sdks" 2>/dev/null)" ]; then
            for url in \
              "https://github.com/theos/sdks/archive/refs/heads/master.tar.xz" \
              "https://github.com/theos/sdks/archive/refs/heads/main.tar.xz"; do
              if curl -L --fail -o /tmp/sdks.tar.xz "$url"; then
                rm -rf /tmp/sdks-src && mkdir -p /tmp/sdks-src
                tar -xf /tmp/sdks.tar.xz -C /tmp/sdks-src || true
                find /tmp/sdks-src -name '*.sdk' -exec cp -R {} "$THEOS/sdks/" \; 2>/dev/null || true
                break
              fi
            done
          fi
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "Available SDKs:"; ls "$THEOS/sdks" || true
          echo "dm.pl:"; ls -l "$THEOS/bin/dm.pl" 2>/dev/null || find "$THEOS" -name 'dm.pl' | head || true

      - name: Build (armv7, iOS 9.0)
        run: |
          set -euo pipefail
          export PATH="$THEOS/bin:$PATH"
          # Repo root contains Makefile (project was pushed as root contents).
          make package FINALPACKAGE=1

      - name: Create unsigned IPA from .app
        run: |
          set -e
          APP_PATH=$(find .theos/_/Applications -name "*.app" -maxdepth 2 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found; listing tree:"
            find .theos -maxdepth 4 2>/dev/null || true
            find . -name "*.app" -maxdepth 5 2>/dev/null || true
            exit 1
          fi
          echo "Found app: $APP_PATH"
          mkdir -p dist/Payload
          cp -R "$APP_PATH" dist/Payload/
          (cd dist && zip -qry IPAInstaller-unsigned.ipa Payload)
          cp packages/*.deb dist/ 2>/dev/null || true
          find . -name "*.deb" -maxdepth 4 2>/dev/null || true
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IPAInstaller-iOS9-armv7
          path: |
            dist/IPAInstaller-unsigned.ipa
            dist/*.deb
          if-no-files-found: error
