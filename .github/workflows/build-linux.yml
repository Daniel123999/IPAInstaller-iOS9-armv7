name: Build IPAInstaller (Linux Theos, iOS 9 armv7)

# 说明：使用 Theos 官方 Linux 安装器（自带 iOS 交叉编译工具链），在 ubuntu 上构建。
# Linux 运行器容量充足、几乎不排队，避免 macOS 运行器排队问题。

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-linux.yml'
      - 'Makefile'
      - 'IPAInstaller.mm'
      - 'control'
      - 'Resources/**'
      - 'entitlements.plist'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos (official Linux installer, includes iOS toolchain)
        run: |
          set -euo pipefail
          export THEOS="$THEOS"
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "toolchain:"; ls "$THEOS/toolchain/linux/iphone/bin" | head || true

      - name: Install iOS SDK (iPhoneOS10.3, armv7 capable)
        run: |
          set -euo pipefail
          # theos/sdks 的 iPhoneOS9.3.sdk 缺少 usr/lib/system/liblaunch.tbd，
          # 导致 ld 解析 libSystem 再导出时报 "file not found: /usr/lib/system/liblaunch.dylib"。
          # 改用完整的 iPhoneOS10.3.sdk（同样支持 armv7），部署目标保持 9.0。
          rm -rf /tmp/theos-sdks
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
          ( cd /tmp/theos-sdks && git sparse-checkout set iPhoneOS10.3.sdk )
          cp -R /tmp/theos-sdks/iPhoneOS10.3.sdk "$THEOS/sdks/"
          test -f "$THEOS/sdks/iPhoneOS10.3.sdk/usr/lib/system/liblaunch.tbd"
          echo "SDKs:"; ls "$THEOS/sdks"

      - name: Build and package (.deb)
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1

      - name: Assemble artifacts (deb + unsigned ipa)
        run: |
          set -euo pipefail
          mkdir -p dist
          APP_PATH=$(find .theos/_ -name '*.app' -maxdepth 4 2>/dev/null | head -n 1 || true)
          if [ -n "$APP_PATH" ]; then
            echo "Found app: $APP_PATH"
            mkdir -p dist/Payload
            cp -R "$APP_PATH" dist/Payload/
            (cd dist && zip -qry IPAInstaller-unsigned.ipa Payload)
          else
            echo "WARNING: .app not found; listing .theos:"; find .theos -maxdepth 4 2>/dev/null | head -50 || true
          fi
          cp packages/*.deb dist/ 2>/dev/null || true
          ls -la dist
          test -n "$(ls -A dist)" || (echo "No artifacts produced" && exit 1)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IPAInstaller-iOS9-armv7
          path: dist/*
          if-no-files-found: error
