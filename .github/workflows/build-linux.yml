name: Build IPAInstaller (Linux Theos, iOS 9 armv7)

# ??:?? Theos ?? Linux ???(?? iOS ???????),? ubuntu ????
# Linux ?????????????,?? macOS ????????

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-linux.yml'
      - 'Makefile'
      - 'IPAInstaller.mm'
      - 'control'
      - 'Resources/**'
      - 'entitlements.plist'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos (official Linux installer, includes iOS toolchain)
        run: |
          set -euo pipefail
          export THEOS="$THEOS"
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "toolchain:"; ls "$THEOS/toolchain/linux/iphone/bin" | head || true

      - name: Install iOS 9.3 SDK (armv7 capable)
        run: |
          set -euo pipefail
          "$THEOS/bin/install-sdk" 9.3
          echo "SDKs:"; ls "$THEOS/sdks"

      - name: Build and package (.deb)
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1

      - name: Assemble artifacts (deb + unsigned ipa)
        run: |
          set -euo pipefail
          mkdir -p dist
          APP_PATH=$(find .theos/_ -name '*.app' -maxdepth 4 2>/dev/null | head -n 1 || true)
          if [ -n "$APP_PATH" ]; then
            echo "Found app: $APP_PATH"
            mkdir -p dist/Payload
            cp -R "$APP_PATH" dist/Payload/
            (cd dist && zip -qry IPAInstaller-unsigned.ipa Payload)
          else
            echo "WARNING: .app not found; listing .theos:"; find .theos -maxdepth 4 2>/dev/null | head -50 || true
          fi
          cp packages/*.deb dist/ 2>/dev/null || true
          ls -la dist
          test -n "$(ls -A dist)" || (echo "No artifacts produced" && exit 1)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IPAInstaller-iOS9-armv7
          path: dist/*
          if-no-files-found: error
